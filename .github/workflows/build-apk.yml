name: Build Android APK

on:
  push:
    branches:
      - claude/flutter-mobile-app-tyedze
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: evrak-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Rename APK for release
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/evrak-debug.apk

      - name: Publish to "latest debug build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: EVRAK - Son Debug APK
          body: |
            Bu, `${{ github.ref_name }}` dalındaki en son commit'ten (${{ github.sha }}) otomatik derlenen debug APK'dır.
            Aşağıdaki `evrak-debug.apk` dosyasına dokunarak doğrudan indirebilirsin (zip açmaya gerek yok).
          prerelease: true
          files: build/app/outputs/flutter-apk/evrak-debug.apk
